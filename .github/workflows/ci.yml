name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @anchor/web lint:tokens
      - run: pnpm --filter @anchor/docs build
      - run: pnpm test
      - run: pnpm test:scripts

  web-e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @anchor/web exec playwright install --with-deps chromium
      - run: pnpm --filter @anchor/web e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  cli-e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Worker serves apps/web/dist as static assets; wrangler dev refuses to start without it.
      - run: pnpm --filter @anchor/web build
      - run: pnpm --filter ./apps/cli test:e2e

  # setup-action/ (install.sh behind it) against a published release, on every runner OS.
  setup-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: anchor
        uses: ./setup-action
        with:
          version: 0.1.0
      - shell: bash
        env:
          INSTALLED: ${{ steps.anchor.outputs.version }}
        run: |
          test "$(anchor --version)" = 0.1.0
          test "$INSTALLED" = 0.1.0
      - if: runner.os != 'Windows'
        run: test "$(anchor-secrets --version)" = 0.1.0

  # `anchor run` on Windows: PATHEXT lookup and .cmd shims (npm, npx, pnpm) through cross-spawn.
  cli-windows-run:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/cli exec vitest run test/integration/process/run-child.test.ts
