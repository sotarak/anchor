name: DCO

# Every commit of a pull request must be signed off by its author (`git commit -s`); see
# CONTRIBUTING.md. Merge commits and GitHub bots are skipped.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check Signed-off-by
        run: node scripts/dco.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
