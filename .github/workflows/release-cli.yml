name: Release

# A `v<version>` tag builds single-file `anchor` binaries with `bun build --compile` and publishes
# them, with SHA256SUMS, as a GitHub Release whose notes are that version's CHANGELOG.md section.
# It then publishes @anchor-secrets/cli to npm (trusted publishing; npm binds the publisher to this
# file name, so do not rename it) and updates Formula/anchor.rb in sotarak/homebrew-tap.
# A pre-release version (`0.2.0-rc.1`) is a GitHub pre-release, goes to the npm dist-tag `next`
# and leaves Homebrew alone. Only a tag push publishes: manual runs (even from a tag) only make a
# `cli-dev-<n>` draft. Tags are `v*` only, because the install script, the Action and the Homebrew
# formula download from `releases/download/v<version>/`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      npm_tag: ${{ steps.check.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag, workspace versions and changelog agree
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          for f in package.json apps/*/package.json packages/*/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$version" ]; then
              echo "::error file=$f::version $v does not match apps/cli ($version)"
              exit 1
            fi
          done
          if [ "$REF_TYPE" = "tag" ]; then
            tag_version="${REF_NAME#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag $REF_NAME does not match package version $version"
              exit 1
            fi
            node scripts/changelog.mjs "$version" > /dev/null
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node scripts/release-meta.mjs "$version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # `native: true` means the runner can execute the binary, so it is smoke-tested there.
          # darwin-x64 and linux-arm64 are cross-compiled (Bun supports every target from any host).
          - {
              target: bun-darwin-arm64,
              asset: anchor-darwin-arm64,
              runner: macos-latest,
              native: true,
            }
          - {
              target: bun-darwin-x64,
              asset: anchor-darwin-x64,
              runner: macos-latest,
              native: false,
            }
          - { target: bun-linux-x64, asset: anchor-linux-x64, runner: ubuntu-latest, native: true }
          - {
              target: bun-linux-arm64,
              asset: anchor-linux-arm64,
              runner: ubuntu-latest,
              native: false,
            }
          - {
              target: bun-windows-x64,
              asset: anchor-windows-x64.exe,
              runner: windows-latest,
              native: true,
            }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build binary
        shell: bash
        run: >
          bun build apps/cli/src/bin.ts --compile
          --target=${{ matrix.target }}
          --define ANCHOR_CLI_VERSION='"${{ steps.version.outputs.version }}"'
          --outfile dist/${{ matrix.asset }}
      - name: Smoke test
        if: matrix.native
        shell: bash
        run: |
          test "$(./dist/${{ matrix.asset }} --version)" = "${{ steps.version.outputs.version }}"
          ./dist/${{ matrix.asset }} --help > /dev/null
          set +e
          ./dist/${{ matrix.asset }} secrets set X=1
          test $? -eq 2
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum anchor-* > SHA256SUMS
      - name: Release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/changelog.mjs "$VERSION" > notes.md
          else
            echo "Draft build of the anchor CLI ($VERSION, run ${{ github.run_number }})." > notes.md
          fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || format('cli-dev-{0}', github.run_number) }}
        run: |
          # A re-run ("Re-run all jobs") finds the release from the first attempt. Keep it and its
          # assets as they are (the Homebrew formula is built from its SHA256SUMS) and let the
          # npm and homebrew jobs run again.
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "::notice::release $TAG already exists; keeping it"
            exit 0
          fi
          # Tag pushes publish right away; manual runs stay drafts.
          flags=()
          if [ "$EVENT" != "push" ]; then flags+=(--draft); fi
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/anchor-* dist/SHA256SUMS \
            --repo "${{ github.repository }}" "${flags[@]}" --title "Anchor v$VERSION" \
            --target "${{ github.sha }}" --notes-file notes.md

  npm:
    if: github.event_name == 'push'
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      NPM_TAG: ${{ needs.verify.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: npm supports trusted publishing
        run: |
          v=$(npm --version)
          IFS=. read -r major minor patch <<< "$v"
          if (( major < 11 || (major == 11 && (minor < 5 || (minor == 5 && patch < 1))) )); then
            echo "::error::npm $v is too old for trusted publishing (needs 11.5.1 or later)"
            exit 1
          fi
      - name: Skip a version that is already published
        id: published
        run: |
          if npm view "@anchor-secrets/cli@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::@anchor-secrets/cli@$VERSION is already on npm"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack and smoke-test the tarball
        if: steps.published.outputs.skip != 'true'
        run: |
          pnpm --filter ./apps/cli pack --pack-destination "$RUNNER_TEMP/pkg"
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/pkg/*.tgz
          test "$("$RUNNER_TEMP/prefix/bin/anchor" --version)" = "$VERSION"
          test "$("$RUNNER_TEMP/prefix/bin/anchor-secrets" --version)" = "$VERSION"
      - name: Publish
        if: steps.published.outputs.skip != 'true'
        run: npm publish "$RUNNER_TEMP"/pkg/*.tgz --access public --tag "$NPM_TAG"

  homebrew:
    if: github.event_name == 'push' && needs.verify.outputs.prerelease == 'false'
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Tap token is configured
        id: token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew update"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@v4
      - name: Generate the formula
        if: steps.token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            -p SHA256SUMS -D dist
          node scripts/homebrew-formula.mjs "$VERSION" dist/SHA256SUMS > "$RUNNER_TEMP/anchor.rb"
          ruby -c "$RUNNER_TEMP/anchor.rb"
      - if: steps.token.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: sotarak/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push the formula
        if: steps.token.outputs.skip != 'true'
        working-directory: tap
        run: |
          mkdir -p Formula
          cp "$RUNNER_TEMP/anchor.rb" Formula/anchor.rb
          if [ -z "$(git status --porcelain)" ]; then
            echo "Formula/anchor.rb is already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/anchor.rb
          git commit -m "anchor $VERSION"
          git push
