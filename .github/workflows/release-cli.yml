name: Release

# A `v<version>` tag builds single-file `anchor` binaries with `bun build --compile` and attaches
# them, with SHA256SUMS, to a draft GitHub Release whose notes are that version's CHANGELOG.md
# section. `cli-v*` tags still work. Manual runs make a `cli-dev-<n>` draft. Nothing is published
# to npm.
on:
  push:
    tags: ["v*", "cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag, workspace versions and changelog agree
        id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          for f in package.json apps/*/package.json packages/*/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$version" ]; then
              echo "::error file=$f::version $v does not match apps/cli ($version)"
              exit 1
            fi
          done
          if [ "$REF_TYPE" = "tag" ]; then
            tag_version="${REF_NAME#cli-}"
            tag_version="${tag_version#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag $REF_NAME does not match package version $version"
              exit 1
            fi
            node scripts/changelog.mjs "$version" > /dev/null
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # `native: true` means the runner can execute the binary, so it is smoke-tested there.
          # darwin-x64 and linux-arm64 are cross-compiled (Bun supports every target from any host).
          - {
              target: bun-darwin-arm64,
              asset: anchor-darwin-arm64,
              runner: macos-latest,
              native: true,
            }
          - {
              target: bun-darwin-x64,
              asset: anchor-darwin-x64,
              runner: macos-latest,
              native: false,
            }
          - { target: bun-linux-x64, asset: anchor-linux-x64, runner: ubuntu-latest, native: true }
          - {
              target: bun-linux-arm64,
              asset: anchor-linux-arm64,
              runner: ubuntu-latest,
              native: false,
            }
          - {
              target: bun-windows-x64,
              asset: anchor-windows-x64.exe,
              runner: windows-latest,
              native: true,
            }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build binary
        shell: bash
        run: >
          bun build apps/cli/src/bin.ts --compile
          --target=${{ matrix.target }}
          --define ANCHOR_CLI_VERSION='"${{ steps.version.outputs.version }}"'
          --outfile dist/${{ matrix.asset }}
      - name: Smoke test
        if: matrix.native
        shell: bash
        run: |
          test "$(./dist/${{ matrix.asset }} --version)" = "${{ steps.version.outputs.version }}"
          ./dist/${{ matrix.asset }} --help > /dev/null
          set +e
          ./dist/${{ matrix.asset }} secrets set X=1
          test $? -eq 2
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum anchor-* > SHA256SUMS
      - name: Release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            node scripts/changelog.mjs "$VERSION" > notes.md
          else
            echo "Draft build of the anchor CLI ($VERSION, run ${{ github.run_number }})." > notes.md
          fi
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('cli-dev-{0}', github.run_number) }}
        run: >
          gh release create "$TAG" dist/anchor-* dist/SHA256SUMS
          --repo "${{ github.repository }}" --draft --title "Anchor v$VERSION"
          --target "${{ github.sha }}" --notes-file notes.md
